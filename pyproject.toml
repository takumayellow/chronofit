[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronofit"
version = "0.1.0"
description = "実測から所要時間を学習してスケジュールへ落とす、手動操作ゼロの時間計測"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# 決済の通知メールを読むときだけ（`chronofit payments`）。他の機能は標準ライブラリだけで動く
gmail = ["google-api-python-client", "google-auth", "google-auth-oauthlib"]

[project.scripts]
chronofit = "chronofit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
