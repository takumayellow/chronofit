[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronofit"
version = "0.1.0"
description = "実測から所要時間を学習してスケジュールへ落とす、手動操作ゼロの時間計測"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
chronofit = "chronofit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
